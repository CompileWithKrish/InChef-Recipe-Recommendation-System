version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: inchef-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-inchef_db}
      MYSQL_USER: ${DB_USERNAME:-inchef_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-inchef_pass}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - inchef_mysql_data:/var/lib/mysql
      - ./data/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  inchef_mysql_data:
    driver: local

