# Server Configuration
server.port=8080
spring.application.name=inchef-backend

# Default Profile (mysql with fallback support)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:mysql}

# Multipart / File Upload Config (if needed)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JSON Serialization
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=UTC
spring.jackson.default-property-inclusion=non_null

# Spring Web Services
spring.webservices.path=/ws

# Logging
logging.level.root=INFO
logging.level.com.inchef=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# Recommendation Engine Configuration
inchef.recommendations.minimum-match-percentage=${RECOMMENDATION_MIN_INGREDIENT_MATCH:75.0}
recommendation.min-ingredient-match=${inchef.recommendations.minimum-match-percentage}

# JWT & Security Configuration
inchef.jwt.secret=${JWT_SECRET:inchef_super_secure_jwt_secret_key_minimum_256_bits_length_here_12345}
inchef.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
inchef.jwt.cookie-name=inchef_auth_token
inchef.auth.lockout-minutes=${AUTH_LOCKOUT_MINUTES:15}
inchef.auth.max-failed-attempts=${AUTH_MAX_FAILED_ATTEMPTS:5}
inchef.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://127.0.0.1:8080,http://localhost:3000}

# Google OAuth Configuration
inchef.google.client-id=${GOOGLE_CLIENT_ID:}

# Admin API & Image Retrieval Configuration
inchef.admin.secret=${INCHEF_ADMIN_SECRET:InChefSecureAdminKey2026}
